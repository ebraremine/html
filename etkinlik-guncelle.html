<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
</head>
<body>
    <header>
        <h1>Etkinlik Bilgilerini Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> | 
            <a href="etkinlikler.html">Tüm Etkinlikler</a>
        </nav>
    </header>

    <hr>

    <main>
        <form action="#" method="post">
            <p>
                <label for="ad">Etkinlik Adı:</label><br>
                <input type="text" id="ad" name="ad" value="Yapay Zeka ve Gelecek Konferansı" required>
            </p>

            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="teknoloji" selected>Teknoloji</option>
                    <option value="muzik">Müzik</option>
                    <option value="tiyatro">Tiyatro</option>
                    <option value="spor">Spor</option>
                    <option value="egitim">Eğitim</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih:</label><br>
                <input type="date" id="tarih" name="tarih" value="2026-10-15" required>
            </p>

            <p>
                <label for="saat">Saat:</label><br>
                <input type="time" id="saat" name="saat" value="14:00" required>
            </p>

            <p>
                <label for="yer">Yer / Mekan:</label><br>
                <input type="text" id="yer" name="yer" value="Teknoloji Merkezi Amfisi" required>
            </p>

            <p>
                <label for="aciklama">Etkinlik Açıklaması:</label><br>
                <textarea id="aciklama" name="aciklama" rows="5" cols="40">Yapay zekanın iş dünyası ve günlük yaşam üzerindeki etkilerinin tartışılacağı uzman paneli.</textarea>
            </p>

            <p>
                <button type="submit">Güncelle</button>
            </p>
        </form>
    </main>
</body>
</html>
